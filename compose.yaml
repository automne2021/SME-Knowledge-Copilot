services:
  db:
    # Reuse the existing PostgreSQL 16 image; RAG vectors live in Qdrant.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      # Cổng 5433 trên máy host để tránh trùng với PostgreSQL cài sẵn.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has bash; do not assume curl/wget is installed.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # M1 topology (option A, 12/11/2026): Compose runs only storage. API, ingestion worker and
  # frontend run on the Windows host (start-web.cmd or the commands in README), because E5 needs
  # requirements-worker-cpu.lock, which pins Windows Torch wheels. A Linux API/worker image is
  # Roadmap. Migrations and seed are explicit steps, never part of service startup.

volumes:
  db_data:
  qdrant_data:
